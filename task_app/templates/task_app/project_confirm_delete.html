{% extends "base.html" %}

{% block content %}
<h1>{{ project.name }}</h1>

<table>
  <tr>
    <th>プロジェクト名</th>
    <td>{{ project.name }}</td>
  </tr>

  <tr>
    <th>作成日</th>
    <td>{{ project.created_at|date:"Y/m/d" }}</td>
  </tr>

  <tr>
    <th>更新日</th>
    <td>{{ project.updated_at|date:"Y/m/d" }}</td>
  </tr>
</table>

<p>
  <form method="POST" action="{% url 'project_delete' project.id %}">
    {% csrf_token %}
    <button type="submit" onclick="return confirm('Are you sure you want to delete this item?');">
        削除
    </button>
  </form>
</p>
{% endblock %}
