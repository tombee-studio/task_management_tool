{% for task in tasks %}
<tr>
  <td>
    <a href="{% url 'task_detail' task.pk %}">
      {{ task.title }}
    </a>
  </td>
  <td>{{ task.assignee.username }}</td>
  <td>{{ task.status.name }}</td>
  <td>{{ task.deadline|date:"Y/m/d" }}</td>
</tr>
{% include "task_app/task_list_item.html" with tasks=task.tasks.all nest_count=nest_count|add:1 %}
{% endfor %}
