{% extends "base.html" %}

{% block content %}
<h1>プロジェクト一覧</h1>

<p>
  <a href="{% url 'project_create' %}">新規プロジェクト作成</a>
</p>

{% if projects %}
  <table>
    <thead>
      <tr>
        <th>プロジェクト名</th>
        <th>作成日</th>
      </tr>
    </thead>
    <tbody>
      {% for project in projects %}
        <tr>
          <td>
            <a href="{% url 'project_detail' project.pk %}?{{ status_filter }}">
              {{ project.name }}
            </a>
          </td>
          <td>{{ project.created_at|date:"Y/m/d" }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>プロジェクトはまだ登録されていません。</p>
{% endif %}
{% endblock %}
