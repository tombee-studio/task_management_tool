{% extends "base.html" %}

{% block content %}
<h1>{{ task.name }}</h1>

<table>
  <tr>
    <th>タスク名</th>
    <td>{{ task.name }}</td>
  </tr>

  <tr>
    <th>作成日</th>
    <td>{{ task.created_at|date:"Y/m/d" }}</td>
  </tr>

  <tr>
    <th>更新日</th>
    <td>{{ task.updated_at|date:"Y/m/d" }}</td>
  </tr>
</table>

<p>
  <form method="POST" action="{% url 'task_delete' task.id %}">
    {% csrf_token %}
    <button type="submit" onclick="return confirm('Are you sure you want to delete this item?');">
        削除
    </button>
  </form>
</p>
{% endblock %}
