components:
  schemas:
    ApiKeyResponse:
      type: object
      properties:
        api_key:
          type: string
      required:
      - api_key
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author:
          type: integer
        description:
          type: string
        task:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - created_at
      - description
      - id
      - updated_at
    Event:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
        event_date:
          type: string
          format: date
        participant_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        project:
          type: integer
        status:
          type: integer
          nullable: true
        previous_event:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_date
      - id
      - project
      - updated_at
    EventStatus:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
        is_done:
          type: boolean
        project:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Inventory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 128
        event:
          type: integer
          nullable: true
        previous_inventory:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - updated_at
    InventoryItemRelation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        item:
          type: integer
        inventory:
          type: integer
        case_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        item_count:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - inventory
      - item
      - updated_at
    Item:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 128
        count_per_case:
