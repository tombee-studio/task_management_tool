{% extends "base.html" %}

{% block content %}
<h1>種別削除確認</h1>

<p>「{{ object.name }}」を削除しますか？</p>

<form method="POST">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">削除</button>
  {% if object.project %}
    <a href="{% url 'project_detail' object.project.pk %}#tab-task-type" class="btn btn-default">キャンセル</a>
  {% else %}
    <a href="{% url 'project_list' %}" class="btn btn-default">キャンセル</a>
  {% endif %}
</form>
{% endblock %}
