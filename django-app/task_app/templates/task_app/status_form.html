{% extends "base_form.html" %}

{% block header_links %}
{% if object %}
  <h1>ステータス編集</h1>
{% else %}
  <h1>ステータス作成</h1>
{% endif %}
{% endblock %}

{% block form_button %}
<div>
  <button type="submit">保存</button>

  {% if object %}
    <a href="{% url 'status_detail' object.pk %}">キャンセル</a>
  {% else %}
    <a href="{% url 'status_list' %}">キャンセル</a>
  {% endif %}
</div>
{% endblock %}
