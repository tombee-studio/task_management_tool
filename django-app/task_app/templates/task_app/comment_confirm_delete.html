{% extends "base.html" %}
{% load markdown_extras %}

{% block content %}
<h1>タスク#{{ comment.task.id }} {{ comment.task }}へのコメント</h1>

{% include "task_app/components/comment_detail_component.html" with comment=comment %}

<p>
  <form method="POST" action="{% url 'comment_delete' comment.id %}">
    {% csrf_token %}
    <button type="submit" onclick="return confirm('Are you sure you want to delete this item?');">
        削除
    </button>
  </form>
</p>
{% endblock %}
