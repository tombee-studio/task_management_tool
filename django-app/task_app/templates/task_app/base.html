{% load bootstrap3 %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}タスク管理ツール{% endblock %}</title>
    {% bootstrap_css %}
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    {% block navbar %}{% endblock %}
    <div class="container">
      {% bootstrap_messages %}
      {% block content %}{% endblock %}
    </div>
    {% bootstrap_javascript %}
    {% block extra_js %}{% endblock %}
    <footer class="app-footer text-muted text-center py-2">
      {{ GIT_HASH }}
    </footer>
  </body>
</html>
