{% extends "base_form.html" %}

{% block header_links %}
{% if object %}
  <h1>フィールド編集 — {{ task_type.name }}</h1>
{% else %}
  <h1>フィールド追加 — {{ task_type.name }}</h1>
{% endif %}
{% endblock %}

{% block form_button %}
<div>
  <button type="submit">保存</button>
  {% if project %}
    <a href="{% url 'project_detail' project.pk %}#tab-task-type">キャンセル</a>
  {% else %}
    <a href="{% url 'project_list' %}">キャンセル</a>
  {% endif %}
</div>
{% endblock %}
