{% extends "base.html" %}

{% load bootstrap3 %}

{% block content %}
{% block header_links%}
{% endblock %}

{% bootstrap_messages %}

<form method="post">
  {% csrf_token %}

  {% bootstrap_form form %}
  {% buttons %}
    <button type="submit" class="btn btn-primary">
      {% bootstrap_icon "send" %} Submit
    </button>
  {% endbuttons %}
</form>
{% endblock %}
