<table class="table">
  <thead>
    <tr>
      <th>イベント</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for event in events %}
      <tr>
        <td>
          <a href="{% url 'event_detail' event.pk %}">
            {{ event.name }}
          </a>
        </td>
        <td>{{ event.event_date|date:"Y/m/d" }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
