name: Deploy to Production

on:
  push:
    branches:
      - releases

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: django-serverless-prd
  LAMBDA_WEB: django-serverless-prd-web
  LAMBDA_MIGRATE: django-serverless-prd-migrate

jobs:
  tag-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            MAJOR=$(echo $LATEST_TAG | cut -d. -f1 | tr -d 'v')
            MINOR=$(echo $LATEST_TAG | cut -d. -f2)
            PATCH=$(echo $LATEST_TAG | cut -d. -f3)
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT_TAG"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push \
            ./django-app
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update web Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_WEB }} \
            --image-uri ${{ steps.build-image.outputs.image }}

      - name: Wait for web Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_WEB }}

      - name: Update migrate Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_MIGRATE }} \
            --image-uri ${{ steps.build-image.outputs.image }}

      - name: Wait for migrate Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_MIGRATE }}

      - name: Run database migration
        run: |
          aws lambda invoke \
            --function-name ${{ env.LAMBDA_MIGRATE }} \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/migrate-response.json
          cat /tmp/migrate-response.json
